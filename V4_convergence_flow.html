<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NEXUS V4 — Emergent Possibility</title><style>body{margin:0;background:#08080c;color:#f5f5f7;font-family:system-ui,sans-serif}main{max-width:1100px;margin:auto;padding:32px 20px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.card{background:#111116;border:1px solid #292932;border-radius:20px;padding:18px}textarea{width:100%;min-height:130px;box-sizing:border-box;background:#0b0b10;color:#fff;border:1px solid #30303a;border-radius:14px;padding:13px;font:inherit}button{margin:16px 0;padding:12px 20px;border:0;border-radius:999px;font-weight:700}.emerge{font-size:24px;font-weight:700;margin:12px 0}.poss{border:1px solid #363640;border-radius:14px;padding:14px;margin-top:10px}.muted{opacity:.6}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><main><div class="muted">NEXUS / V4 / EMERGENT POSSIBILITY</div><h1>Quand deux situations se rencontrent.</h1><p class="muted">NEXUS ne décide pas pour les personnes. Il rend visible une possibilité créée par la combinaison de leurs situations.</p><div class="grid"><section class="card"><h2>A</h2><textarea id="a">Je viens d'arriver dans cette ville et je ne connais personne. J'aimerais découvrir les environs.</textarea></section><section class="card"><h2>B</h2><textarea id="b">Je connais très bien les environs et j'aime organiser des petites sorties pour faire découvrir la région.</textarea></section></div><button id="go">Faire émerger les possibilités</button><section class="card" id="out"></section></main><script src="./V4_possibility_engine.js"></script><script src="./V4_possibility_to_convergence.js"></script><script>const $=s=>document.querySelector(s);function run(){const E=window.NEXUS?.PossibilityEngineV4,C=window.NEXUS?.PossibilityConvergenceV4;if(!E||!C){$('#out').innerHTML='<b>Moteur V4 indisponible.</b>';return}const a=E.analyze($('#a').value),b=E.analyze($('#b').value),r=C.generate(a,b);let h='<h2>Ce que les deux situations rendent possible</h2>';h+='<div class="emerge">'+(r.status==='possibility_emerged'?'Une possibilité émerge.':'Rien de suffisamment étayé pour le moment.')+'</div>';h+=r.possibilities.map(x=>'<div class="poss"><b>'+x.proposition+'</b><br><small>'+x.rationale+'<br>Confiance indicative : '+x.confidence+'% · Confirmation requise</small></div>').join('');h+='<p class="muted">NEXUS n’attribue aucune intention. Les personnes décident elles-mêmes si la possibilité leur convient.</p>';$('#out').innerHTML=h}$('#go').onclick=run;run();</script></body></html>
