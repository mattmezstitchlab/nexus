<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NEXUS V4 • Cube State</title>
<style>body{margin:0;background:#07070b;color:#f4f4f5;font-family:Inter,system-ui,sans-serif}main{max-width:1000px;margin:auto;padding:36px 20px}.eyebrow{text-transform:uppercase;letter-spacing:.16em;font-size:11px;opacity:.55}textarea{width:100%;min-height:100px;box-sizing:border-box;background:#0d0d12;color:#fff;border:1px solid #292933;border-radius:14px;padding:14px;font:inherit}button{margin-top:10px;padding:10px 16px;border:0;border-radius:999px;font-weight:700}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:18px}@media(max-width:700px){.grid{grid-template-columns:1fr}}.panel{border:1px solid #26262f;border-radius:20px;padding:18px;background:#101014}.face{display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid #22222a}.bar{height:5px;background:#27272e;border-radius:9px;margin-top:7px}.fill{height:100%;background:#fff;border-radius:9px}.unknown{color:#fbbf24}.poss{margin:8px 0;padding:11px;border-radius:12px;background:#16161d}</style></head>
<body><main><div class="eyebrow">NEXUS / V4 / CUBE STATE</div><h1>La situation devient une forme.</h1><p>Le cube ne prétend pas connaître une intention inconnue. Il visualise les dimensions réellement extraites par le moteur.</p><textarea id="input">J'ai une chambre qui ne sert plus depuis que ma fille est partie.</textarea><button id="go">Transformer en état du cube</button><div class="grid"><section class="panel"><div id="faces"></div></section><section class="panel"><div id="meta"></div><h3>Possibilités</h3><div id="poss"></div></section></div></main>
<script src="./V4_possibility_engine.js"></script><script src="./V4_cube_adapter.js"></script><script>
(()=>{const e=document.querySelector('#input'),f=document.querySelector('#faces'),m=document.querySelector('#meta'),p=document.querySelector('#poss');const engine=window.NEXUS?.PossibilityEngineV4;const adapter=window.NEXUS?.CubeAdapterV4;if(!engine||!adapter){m.innerHTML='<span class="unknown">Moteur V4 indisponible.</span>';return}const labels={besoin:'Besoin',ressource:'Ressource',capacite:'Capacité',contexte:'Contexte',temporalite:'Temporalité',incertitude:'Incertitude',possibilite:'Possibilité'};function render(){const a=engine.analyze(e.value),s=adapter.toCubeState(a);f.innerHTML=Object.entries(s.dimensions).map(([k,v])=>`<div class="face"><span>${labels[k]}</span><strong>${v}%</strong><div class="bar"><div class="fill" style="width:${v}%"></div></div></div>`).join('');m.innerHTML=`<p>Mode : <strong>${s.visualMode}</strong></p><p>Intention : <strong class="${s.intention.status==='unknown'?'unknown':''}">${s.intention.status}</strong></p><p>Incertitude : <strong>${s.uncertainty}%</strong></p>`;p.innerHTML=s.possibilities.map(x=>`<div class="poss"><strong>${x.label}</strong><br><small>${x.confidence}% • ${x.rationale}</small></div>`).join('')||'<small>Aucune possibilité étayée.</small>'}document.querySelector('#go').onclick=render;render()})();</script></body></html>
