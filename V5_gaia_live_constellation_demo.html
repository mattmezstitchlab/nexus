<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NEXUS × GAÏA V5</title><style>body{margin:0;background:#07070b;color:#f5f5f7;font-family:system-ui;padding:28px}main{max-width:920px;margin:auto}.card{background:#101017;border:1px solid #2b2b35;border-radius:22px;padding:20px;margin:14px 0}input,textarea{width:100%;box-sizing:border-box;background:#07070b;color:#fff;border:1px solid #343440;border-radius:12px;padding:11px;margin:6px 0}button{padding:10px 15px;border-radius:999px;border:0;font-weight:800;cursor:pointer}#status{white-space:pre-wrap;line-height:1.5}.node{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;width:76px;height:76px;border-radius:50%;margin:10px;border:1px solid #555;background:#171720;font-size:11px}.root{width:118px;height:118px;background:#eee;color:#111}.possibility{border-style:dashed;opacity:.8}.solid{display:inline-block;width:26px;border-top:2px solid #aaa}.dash{display:inline-block;width:26px;border-top:2px dashed #aaa}</style><main><small>NEXUS × GAÏA / V5 LIVE BRIDGE</small><h1>Brancher un vrai monde GAÏA</h1><div class="card"><label>Endpoint Base44 World Engine</label><input id="endpoint" placeholder="https://.../functions/worldEngine"><label>World ID</label><input id="worldId" placeholder="world_id réel"><label>Expression NEXUS</label><textarea id="expression">Je viens d'arriver et je ne connais encore personne.</textarea><button id="load">Connecter GAÏA</button><p id="status">Prêt. Le bridge appelle le World Engine puis convertit WorldEntity + WorldRelation en constellation.</p></div><div class="card"><span class="solid"></span> relation réelle &nbsp; <span class="dash"></span> possibilité NEXUS<div id="world"></div></div></main><script src="./V4_possibility_engine.js"></script><script src="./V4_cube_adapter.js"></script><script src="./V4_gaia_world_adapter.js"></script><script src="./V5_gaia_live_bridge.js"></script><script>const $=s=>document.querySelector(s);$('#load').onclick=async()=>{const status=$('#status'),out=$('#world');status.textContent='Connexion à GAÏA…';out.innerHTML='';try{const a=NEXUS.PossibilityEngineV4.analyze($('#expression').value),c=NEXUS.CubeAdapterV4.toCubeState(a),s=await NEXUS.GaiaLiveBridgeV5.load({endpoint:$('#endpoint').value.trim(),worldId:$('#worldId').value.trim(),analysis:a,cubeState:c});status.textContent=`Connecté à « ${s.world.name} »\n${s.nodes.length} nœuds · ${s.links.length} liens`;s.nodes.forEach(n=>{const d=document.createElement('button');d.className='node '+(n.root?'root ':'')+(n.type==='possibility'?'possibility':'');d.textContent=n.label;d.title=n.type;out.appendChild(d)});const links=document.createElement('pre');links.textContent=s.links.map(l=>`${l.dashed?'···':'━━━'} ${l.label}: ${l.from} → ${l.to}`).join('\n');out.appendChild(links)}catch(e){status.textContent='Erreur : '+e.message}}</script></html>
