<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NEXUS V4 • Convergence</title><style>body{margin:0;background:#07070b;color:#f5f5f5;font-family:Inter,system-ui,sans-serif}main{max-width:1100px;margin:auto;padding:32px 20px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.card{background:#101014;border:1px solid #28282f;border-radius:18px;padding:16px}textarea{width:100%;min-height:110px;box-sizing:border-box;background:#0b0b10;color:#fff;border:1px solid #292932;border-radius:12px;padding:12px;font:inherit}button{margin:14px 0;padding:11px 18px;border:0;border-radius:999px;font-weight:700}.result{margin-top:16px}.match{padding:14px;border-radius:14px;background:#17171e;margin:8px 0}.muted{opacity:.6}.possible{font-size:20px;font-weight:700}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><main><p class="muted">NEXUS / V4 / CONVERGENCE LAB</p><h1>Deux situations. Une possibilité émergente.</h1><div class="grid"><section class="card"><h2>Situation A</h2><textarea id="a">Je viens d'arriver ici et je ne connais personne. J'aimerais rencontrer du monde.</textarea></section><section class="card"><h2>Situation B</h2><textarea id="b">Je connais très bien la région et j'organise régulièrement des sorties avec des petits groupes.</textarea></section></div><button id="go">Chercher une convergence</button><section class="card result" id="out"></section></main><script src="./V4_possibility_engine.js"></script><script src="./V4_convergence_engine.js"></script><script>const $=s=>document.querySelector(s);function run(){const E=window.NEXUS?.PossibilityEngineV4,C=window.NEXUS?.ConvergenceEngineV4;if(!E||!C){$('#out').innerHTML='<b>Moteur V4 indisponible.</b>';return}const a=E.analyze($('#a').value),b=E.analyze($('#b').value),r=C.compare(a,b);let html='<h2>Résultat</h2><div class="possible">'+(r.status==='possible'?'Une convergence est possible.':'Aucune convergence suffisamment étayée.')+'</div><p>Score indicatif : '+r.score+'% · Incertitude : '+r.uncertainty+'%</p>';html+=r.matches.map(m=>'<div class="match"><b>'+m.type+'</b><br>'+m.reason+'</div>').join('');html+='<p class="muted">Une convergence n’est jamais une intention attribuée. Elle doit être confirmée par les personnes concernées.</p>';$('#out').innerHTML=html}$('#go').onclick=run;run();</script></body></html>
